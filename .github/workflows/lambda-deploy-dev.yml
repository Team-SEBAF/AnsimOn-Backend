name: Deploy Lambda (dev)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-layer:
    runs-on: ubuntu-latest
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: |
          pip install poetry
          poetry self add poetry-plugin-export

      - name: Export requirements.txt
        run: |
          poetry export \
            --format=requirements.txt \
            --without-hashes \
            --output requirements.txt

      - name: Prepare layer requirements
        run: |
          cp requirements.txt requirements.layer.txt
          sed -i '/^boto3/d;/^botocore/d;/^s3transfer/d' requirements.layer.txt

      - name: Build layer
        run: |
          mkdir -p layer/python
          docker run --rm \
            -v "$PWD":/var/task \
            --platform linux/amd64 \
            public.ecr.aws/sam/build-python3.11 \
            bash -c "
              pip install --no-cache-dir -r requirements.layer.txt -t layer/python
            "

      - name: Zip layer
        run: |
          cd layer
          zip -r layer.zip .
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish layer
        id: publish
        run: |
          ARN=$(aws lambda publish-layer-version \
            --layer-name ansimon-deps \
            --zip-file fileb://layer/layer.zip \
            --compatible-runtimes python3.11 \
            --query LayerVersionArn \
            --output text)
          echo "layer_arn=$ARN" >> $GITHUB_OUTPUT

  deploy-lambda:
    runs-on: ubuntu-latest
    needs: deploy-layer

    steps:
      - uses: actions/checkout@v4

      - name: Build lambda package
        run: |
          mkdir package
          cp -r app package/
          cd package
          zip -r ../lambda.zip .
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip

      - name: Wait for lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Attach layer
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --layers ${{ needs.deploy-layer.outputs.layer_arn }}

      - name: Wait after layer attach
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Publish version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --query Version \
            --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update alias
        run: |
          aws lambda update-alias \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --name dev \
            --function-version ${{ steps.publish.outputs.version }}
