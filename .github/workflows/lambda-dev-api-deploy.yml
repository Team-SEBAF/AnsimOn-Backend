name: Deploy Lambda (dev)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build lambda package (app only)
        run: |
          rm -rf package lambda.zip
          mkdir package
          cp -r app package/
          cd package
          zip -r ../lambda.zip . > /dev/null
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip

      - name: Wait for update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Attach latest layer
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --layers $(aws lambda list-layer-versions \
              --layer-name ansimon-deps \
              --query 'LayerVersions[0].LayerVersionArn' \
              --output text)

      - name: Publish version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --query Version \
            --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update alias
        run: |
          aws lambda update-alias \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --name dev \
            --function-version ${{ steps.publish.outputs.version }}
