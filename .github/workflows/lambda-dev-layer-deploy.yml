name: Deploy Lambda Layer (dev)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-layer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. Poetry 2 + export plugin 설치
      - name: Install poetry
        run: |
          pip install poetry
          poetry self add poetry-plugin-export
          poetry export --help

      # 2. requirements.txt 생성 (gitignore여도 상관없음)
      - name: Export requirements.txt
        run: |
          poetry export \
            --format=requirements.txt \
            --without-hashes \
            --output requirements.txt

      # 3. Layer 전용 requirements 생성 (boto3 제거)
      - name: Prepare layer requirements
        run: |
          cp requirements.txt requirements.layer.txt
          sed -i '/^boto3/d;/^botocore/d;/^s3transfer/d' requirements.layer.txt

      # 4. Layer 빌드 (Lambda 호환 Docker)
      - name: Build layer
        run: |
          rm -rf layer
          mkdir -p layer/python

          docker run --rm \
            -v "$PWD":/var/task \
            --platform linux/amd64 \
            public.ecr.aws/sam/build-python3.11 \
            bash -c "
              pip install --upgrade pip &&
              pip install --no-cache-dir -r requirements.layer.txt -t layer/python
            "

      # 5. layer.zip 생성
      - name: Zip layer
        run: |
          cd layer
          zip -r layer.zip . > /dev/null
          cd ..

      # 6. AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 7. Layer publish
      - name: Publish layer
        run: |
          aws lambda publish-layer-version \
            --layer-name ansimon-deps \
            --zip-file fileb://layer/layer.zip \
            --compatible-runtimes python3.11
