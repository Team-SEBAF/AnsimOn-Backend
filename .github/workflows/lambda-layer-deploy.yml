name: Deploy Lambda Layer

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-layer:
    runs-on: ubuntu-latest
    env:
      # Use workflow from: main → prod, dev → dev
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: |
          pip install poetry
          poetry self add poetry-plugin-export

      - name: Export requirements.txt
        run: |
          poetry export \
            --format=requirements.txt \
            --without-hashes \
            --output requirements.txt

      - name: Prepare layer requirements
        run: |
          cp requirements.txt requirements.layer.txt
          # Lambda 런타임에 이미 있음
          sed -i '/^boto3/d;/^botocore/d;/^s3transfer/d' requirements.layer.txt
          # 마이그레이션 전용 — Lambda 런타임에는 불필요 (alembic 제거 후에도 export에 남는 mako 줄 삭제)
          sed -i '/^alembic/d;/^mako/d' requirements.layer.txt

      - name: Build layer
        run: |
          mkdir -p layer/python
          docker run --rm \
            -v "$PWD":/var/task \
            --platform linux/amd64 \
            public.ecr.aws/sam/build-python3.11 \
            bash -c "
              pip install --no-cache-dir -r requirements.layer.txt -t layer/python
            "

      - name: Prune layer bloat
        run: |
          find layer/python -type d -name tests -exec rm -rf {} + 2>/dev/null || true
          find layer/python -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Zip layer
        run: |
          cd layer
          zip -r layer.zip .
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ 'ap-northeast-2' }}

      - name: Publish layer
        run: |
          aws lambda publish-layer-version \
            --layer-name ansimon-deps \
            --zip-file fileb://layer/layer.zip \
            --compatible-runtimes python3.11

  attach-layer-and-publish:
    runs-on: ubuntu-latest
    needs: deploy-layer
    env:
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ 'ap-northeast-2' }}

      - name: Attach latest layer
        env:
          FUNC_NAME: ${{ env.ENV == 'dev' && 'ansimon-api' || 'ansimon-api-prod' }}
        run: |
          # 새 ansimon-deps 버전
          NEW_DEPS_ARN=$(aws lambda list-layer-versions \
            --layer-name ansimon-deps \
            --query 'LayerVersions[0].LayerVersionArn' \
            --output text)
          echo "New ansimon-deps: $NEW_DEPS_ARN"

          # 기존 레이어 중 ansimon-deps 제외 (다른 레이어 유지)
          CURRENT_LAYERS=$(aws lambda get-function-configuration \
            --function-name $FUNC_NAME \
            --query 'Layers[*].Arn' \
            --output text)
          OTHER_LAYERS=$(echo "$CURRENT_LAYERS" | tr '\t' ' ' | tr ' ' '\n' | grep -v 'ansimon-deps' | tr '\n' ' ' | xargs)

          # ansimon-deps(최신) + 기존 다른 레이어들
          LAYERS=$(echo "$NEW_DEPS_ARN $OTHER_LAYERS" | xargs)
          echo "Layers to attach: $LAYERS"

          aws lambda update-function-configuration \
            --function-name $FUNC_NAME \
            --layers $LAYERS

      - name: Wait after layer attach
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.ENV == 'dev' && 'ansimon-api' || 'ansimon-api-prod' }}

      - name: Publish version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name ${{ env.ENV == 'dev' && 'ansimon-api' || 'ansimon-api-prod' }} \
            --query Version \
            --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update alias
        run: |
          aws lambda update-alias \
            --function-name ${{ env.ENV == 'dev' && 'ansimon-api' || 'ansimon-api-prod' }} \
            --name ${{ env.ENV }} \
            --function-version ${{ steps.publish.outputs.version }}
