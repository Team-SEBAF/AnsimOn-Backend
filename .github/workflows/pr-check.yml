name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build lambda package (app only)
        run: |
          rm -rf package lambda.zip
          mkdir package
          cp -r app package/
          cd package
          zip -r ../lambda.zip . > /dev/null
          cd ..

      - name: Check zip exists
        run: test -f lambda.zip
