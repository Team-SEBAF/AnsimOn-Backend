name: PR Check

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - "README.md"
      - "README.ko.md"
      - "**.md"

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build lambda package (app only)
        run: |
          mkdir package
          cp -r app package/
          cd package
          zip -r ../lambda.zip . > /dev/null
          cd ..

      - name: Check zip exists
        run: test -f lambda.zip
